name: EquityAI Retrieval Diagnostic

on:
  push:
    paths:
      - ".github/workflows/retrieval-diagnostic.yml"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-2
  ECS_CLUSTER: equityai-production
  ECS_SERVICE: equityai-api-service
  TASK_DEFINITION: equityai-api:18

jobs:
  diagnose:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009910376113:role/EquityAIGitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Run retrieval diagnostic
        run: |
          NETWORK_CONFIGURATION=$(aws ecs describe-services             --cluster "$ECS_CLUSTER"             --services "$ECS_SERVICE"             --query 'services[0].networkConfiguration'             --output json)

          TASK_ARN=$(aws ecs run-task             --cluster "$ECS_CLUSTER"             --launch-type FARGATE             --task-definition "$TASK_DEFINITION"             --network-configuration "$NETWORK_CONFIGURATION"             --overrides '{
              "containerOverrides": [
                {
                  "name": "equityai-api",
                  "command": [
                    "python",
                    "-m",
                    "scripts.diagnose_hsbc_retrieval"
                  ]
                }
              ]
            }'             --query 'tasks[0].taskArn'             --output text)

          echo "Diagnostic task: $TASK_ARN"

          aws ecs wait tasks-stopped             --cluster "$ECS_CLUSTER"             --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks             --cluster "$ECS_CLUSTER"             --tasks "$TASK_ARN"             --query 'tasks[0].containers[0].exitCode'             --output text)

          TASK_ID="${TASK_ARN##*/}"

          echo "=== DIAGNOSTIC OUTPUT ==="

          aws logs get-log-events             --log-group-name "/ecs/equityai-api"             --log-stream-name "ecs/equityai-api/$TASK_ID"             --query 'events[].message'             --output text

          echo "=== EXIT CODE: $EXIT_CODE ==="

          test "$EXIT_CODE" = "0"
