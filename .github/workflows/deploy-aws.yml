name: EquityAI AWS Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: equityai-api
  ECS_TASK_FAMILY: equityai-api
  ECS_CLUSTER: equityai-production
  ECS_SERVICE: equityai-api-service
  ECS_TASK_ROLE_ARN: arn:aws:iam::009910376113:role/equityaiEcsTaskRole
  DOCUMENTS_S3_BUCKET: equityai-production-documents-009910376113
  INGESTION_QUEUE_URL: https://sqs.eu-west-2.amazonaws.com/009910376113/equityai-document-ingestion

jobs:
  deploy:
    name: Build and Publish to AWS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -q

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009910376113:role/EquityAIGitHubActionsRole
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

          echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition \
            > task-definition.json

      - name: Prepare new ECS task definition
        env:
          IMAGE_URI: ${{ steps.build-image.outputs.image }}
        run: |
          python - <<'PY'
          import json
          import os

          path = "task-definition.json"

          with open(path) as f:
              task = json.load(f)

          for field in [
              "taskDefinitionArn",
              "revision",
              "status",
              "requiresAttributes",
              "compatibilities",
              "registeredAt",
              "registeredBy",
          ]:
              task.pop(field, None)

          task["taskRoleArn"] = os.environ["ECS_TASK_ROLE_ARN"]

          container = task["containerDefinitions"][0]
          container["image"] = os.environ["IMAGE_URI"]

          environment = {
              item["name"]: item
              for item in container.get("environment", [])
          }

          environment["DOCUMENTS_S3_BUCKET"] = {
              "name": "DOCUMENTS_S3_BUCKET",
              "value": os.environ["DOCUMENTS_S3_BUCKET"],
          }

          environment["INGESTION_QUEUE_URL"] = {
              "name": "INGESTION_QUEUE_URL",
              "value": os.environ["INGESTION_QUEUE_URL"],
          }

          container["environment"] = list(environment.values())

          with open("task-definition-deploy.json", "w") as f:
              json.dump(task, f, indent=2)
          PY

      - name: Register new ECS task definition
        id: register-task
        run: |
          TASK_DEFINITION_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition-deploy.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "task_definition_arn=$TASK_DEFINITION_ARN" >> "$GITHUB_OUTPUT"
          echo "Registered: $TASK_DEFINITION_ARN"

      - name: Run database migrations
        env:
          TASK_DEFINITION_ARN: ${{ steps.register-task.outputs.task_definition_arn }}
        run: |
          echo "Reading production ECS network configuration..."

          NETWORK_CONFIGURATION=$(aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query 'services[0].networkConfiguration' \
            --output json)

          echo "Starting one-off database migration task..."

          MIGRATION_TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --launch-type FARGATE \
            --task-definition "$TASK_DEFINITION_ARN" \
            --network-configuration "$NETWORK_CONFIGURATION" \
            --overrides '{
              "containerOverrides": [
                {
                  "name": "equityai-api",
                  "command": [
                    "python",
                    "-m",
                    "scripts.apply_async_ingestion_migrations"
                  ]
                }
              ]
            }' \
            --query 'tasks[0].taskArn' \
            --output text)

          if [ -z "$MIGRATION_TASK_ARN" ] || [ "$MIGRATION_TASK_ARN" = "None" ]; then
            echo "ERROR: ECS migration task failed to start."
            exit 1
          fi

          echo "Migration task: $MIGRATION_TASK_ARN"
          echo "Waiting for migration task to stop..."

          aws ecs wait tasks-stopped \
            --cluster "$ECS_CLUSTER" \
            --tasks "$MIGRATION_TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$MIGRATION_TASK_ARN" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)

          STOP_REASON=$(aws ecs describe-tasks \
            --cluster "$ECS_CLUSTER" \
            --tasks "$MIGRATION_TASK_ARN" \
            --query 'tasks[0].stoppedReason' \
            --output text)

          echo "Migration task exit code: $EXIT_CODE"
          echo "Migration task stop reason: $STOP_REASON"

          if [ "$EXIT_CODE" != "0" ]; then
            echo "ERROR: Database migration failed."
            echo "Production API deployment has been blocked."
            exit 1
          fi

          echo "Database migrations completed successfully."

      - name: Deploy new task definition to ECS service
        env:
          TASK_DEFINITION_ARN: ${{ steps.register-task.outputs.task_definition_arn }}
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "$TASK_DEFINITION_ARN" \
            --force-new-deployment

          echo "Waiting for ECS service to become stable..."

          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

          echo "ECS deployment completed successfully"
